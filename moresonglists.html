<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更多歌单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }

        /* 页面背景 可替换背景图链接 */
        body {
            background: url("./photosix.jpg") no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
        }

        /* 背景遮罩，使用指定配色渐变 */
        .bg-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                rgba(221, 234, 250, 0.85),
                rgba(245, 206, 233, 0.75),
                rgba(184, 176, 213, 0.75),
                rgba(127, 155, 195, 0.7)
            );
            z-index: -1;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 页面标题 */
        .page-title {
            text-align: center;
            color: #ffffff;
            font-size: 38px;
            margin-bottom: 50px;
            letter-spacing: 4px;
            text-shadow: 0 2px 10px rgba(127, 155, 195, 0.6);
        }

        /* 核心：六宫格布局 */
        .playlist-grid {
            display: grid;
            /* 固定3列，实现标准六宫格 */
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        /* 歌单卡片 */
        .playlist-card {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(184, 176, 213, 0.3);
            transition: all 0.35s ease;
            padding-bottom: 22px;
        }

        .playlist-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(127, 155, 195, 0.35);
            border-color: rgba(245, 206, 233, 0.6);
        }

        /* 歌单封面 可替换图片 */
        .cover-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .playlist-card:hover .cover-img {
            transform: scale(1.03);
        }

        .playlist-name {
            color: #7F9BC3;
            text-align: center;
            font-size: 19px;
            padding: 18px 10px;
            font-weight: 600;
        }

        /* 音乐播放器 */
        .audio-wrapper {
            padding: 0 18px;
        }

        audio {
            width: 100%;
            height: 42px;
            border-radius: 10px;
        }

        /* 底部说明 */
        .footer-tip {
            text-align: center;
            color: #eceaf2;
            margin-top: 70px;
            font-size: 15px;
            letter-spacing: 1px;
        }

        /* 响应式适配：小屏幕自动变为2列/1列 */
        @media (max-width: 900px) {
            .playlist-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .playlist-grid {
                grid-template-columns: 1fr;
            }
            .page-title {
                font-size: 28px;
                margin-bottom: 35px;
            }
            .cover-img {
                height: 220px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景遮罩层 -->
    <div class="bg-mask"></div>

    <div class="container">
        <h2 class="page-title">更多歌单</h2>

        <!-- 歌单列表 - 标准六宫格 -->
        <div class="playlist-grid">
            <!-- 歌单1 -->
            <div class="playlist-card">
                <img src="./photoone.jpg" alt="歌单封面" class="cover-img">
                <h3 class="playlist-name">治愈轻音乐</h3>
                <div class="audio-wrapper">
                    <audio controls src="./light2.mp3">
                </div>
            </div>

            <!-- 歌单2 -->
            <div class="playlist-card">
                <img src="./photofive.jpg" alt="歌单封面" class="cover-img">
                <h3 class="playlist-name">热门流行曲</h3>
                <div class="audio-wrapper">
                    <audio controls src="./RandBmusic3.mp3">
                </div>
            </div>

            <!-- 歌单3 -->
            <div class="playlist-card">
                <img src="./photoseven.jpg" alt="歌单封面" class="cover-img">
                <h3 class="playlist-name">怀旧经典老歌</h3>
                <div class="audio-wrapper">
                    <audio controls src="./music3.mp3">
                </div>
            </div>

            <!-- 歌单4 -->
            <div class="playlist-card">
                <img src="./photothree.jpg" alt="歌单封面" class="cover-img">
                <h3 class="playlist-name">节奏燃向BGM</h3>
                <div class="audio-wrapper">
                    <audio controls src="./music5.mp3">
                </div>
            </div>

            <!-- 歌单5 -->
            <div class="playlist-card">
                <img src="./phototwo.jpg" alt="歌单封面" class="cover-img">
                <h3 class="playlist-name">欧美流行曲</h3>
                <div class="audio-wrapper">
                    <audio controls src="./music1.mp3">
                </div>
            </div>

            <!-- 歌单6 -->
            <div class="playlist-card">
                <img src="./photosix.jpg" alt="歌单封面" class="cover-img">
                <h3 class="playlist-name">国风古风歌曲</h3>
                <div class="audio-wrapper">
                    <audio controls src="./music7.mp3">
                </div>
            </div>
        </div>

        <p class="footer-tip">© 音乐音频均来源于KuGou音乐</p >
    </div>
</body>
</html>
