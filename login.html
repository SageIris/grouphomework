<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星韵 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        /* 核心配色（与首页一致） */
        :root {
            --color-blue-deep: #7F9BC3;    /* 深海蓝（主色） */
            --color-purple: #B8B0D5;       /* 柔紫调 */
            --color-pink-soft: #F5CEE9;    /* 柔粉调 */
            --color-blue-light: #DDE4FA;   /* 浅蓝调 */
            --color-bg-main: #EEECFA;      /* 页面基底（浅紫白） */
            --color-text: #5A6789;         /* 文字主色 */
            --color-white: #ffffff;        /* 纯白 */
            --color-shadow: rgba(127, 155, 195, 0.2); /* 阴影色 */
        }

        body {
            /* 渐变背景，呼应首页+配色图 */
            background: linear-gradient(135deg, var(--color-bg-main) 0%, var(--color-blue-light) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 登录容器（毛玻璃+圆角） */
        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 40px 30px;
            box-shadow: 0 8px 30px var(--color-shadow);
            border: 1px solid rgba(221, 228, 250, 0.5);
        }

        /* 标题区域 */
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header .logo {
            font-size: 32px;
            font-weight: bold;
            color: var(--color-blue-deep);
            margin-bottom: 8px;
        }
        .login-header .subtitle {
            color: var(--color-text);
            font-size: 14px;
            opacity: 0.8;
        }

        /* 表单样式 */
        .login-form .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        .login-form label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-text);
            font-size: 14px;
        }
        .login-form input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--color-blue-light);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.7);
            color: var(--color-text);
            outline: none;
            transition: all 0.3s;
        }
        .login-form input:focus {
            border-color: var(--color-purple);
            box-shadow: 0 0 8px rgba(184, 176, 213, 0.2);
        }

        /* 验证码行（flex布局） */
        .verify-row {
            display: flex;
            gap: 10px;
        }
        .verify-row input {
            flex: 1;
        }
        .verify-code {
            width: 120px;
            height: 44px;
            background: linear-gradient(90deg, var(--color-purple), var(--color-blue-deep));
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--color-white);
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
        }

        /* 记住密码+忘记密码 */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--color-text);
        }
        .remember-me input {
            width: 16px;
            height: 16px;
            accent-color: var(--color-blue-deep);
        }
        .forgot-pwd {
            color: var(--color-blue-deep);
            text-decoration: none;
        }
        .forgot-pwd:hover {
            color: var(--color-purple);
        }

        /* 登录按钮 */
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, var(--color-blue-deep), var(--color-purple));
            color: var(--color-white);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-login:hover {
            box-shadow: 0 4px 15px rgba(127, 155, 195, 0.3);
            transform: translateY(-2px);
        }

        /* 注册引导 */
        .register-guide {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--color-text);
        }
        .register-guide a {
            color: var(--color-blue-deep);
            text-decoration: none;
            font-weight: 500;
        }
        .register-guide a:hover {
            color: var(--color-purple);
        }

        /* 第三方登录 */
        .other-login {
            margin-top: 30px;
            text-align: center;
        }
        .other-login .divider {
            font-size: 12px;
            color: var(--color-text);
            opacity: 0.6;
            margin-bottom: 15px;
            position: relative;
        }
        .other-login .divider::before,
        .other-login .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background: var(--color-blue-light);
        }
        .other-login .divider::before {
            left: 0;
        }
        .other-login .divider::after {
            right: 0;
        }
        .login-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .login-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--color-bg-main);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--color-blue-deep);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-icon:hover {
            background: var(--color-pink-soft);
            color: var(--color-white);
            transform: scale(1.1);
        }

        /* 响应式适配 */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            .verify-code {
                width: 100px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- 标题区域 -->
        <div class="login-header">
            <div class="logo">星韵</div>
            <div class="subtitle">欢迎回来，继续你的音乐之旅</div>
        </div>

        <!-- 登录表单 -->
        <form class="login-form">
            <div class="form-group">
                <label for="username">账号/手机号/邮箱</label>
                <input type="text" id="username" placeholder="请输入登录账号" required>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" required>
            </div>

            <div class="form-group">
                <label>验证码</label>
                <div class="verify-row">
                    <input type="text" placeholder="请输入验证码" required>
                    <div class="verify-code">8976</div>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" checked>
                    <span>记住密码</span>
                </label>
                <a href="#" class="forgot-pwd">忘记密码？</a>
            </div>

            <button type="submit" class="btn-login">登录</button>
        </form>

        <!-- 注册引导 -->
        <div class="register-guide">
            还没有账号？<a href="register.html">立即注册</a>
        </div>

        <!-- 第三方登录 -->
        <div class="other-login">
            <div class="divider">其他登录方式</div>
            <div class="login-icons">
                <div class="login-icon">🐧</div>
                <div class="login-icon">📱</div>
                <div class="login-icon">🔵</div>
            </div>
        </div>
    </div>
</body>
</html>
