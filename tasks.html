<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务汇总</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        /* 主背景：使用你提供的配色做渐变背景，模拟柔和背景图效果 */
        body {
            /* 用你的配色做渐变背景，替代图片，保证加载快且风格统一 */
            background: linear-gradient(135deg, #DDEAFA 0%, #EEECFA 40%, #B8B0D5 100%);
            min-height: 100vh;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 主容器 */
        .container {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(184, 176, 213, 0.3);
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        /* 头部标题栏 */
        .header {
            background: linear-gradient(90deg, #7F9BC3 0%, #B8B0D5 50%, #F5CEE9 100%);
            padding: 32px;
            text-align: center;
            color: #fff;
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* 任务列表区域 */
        .task-wrapper {
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 任务卡片样式 */
        .task-card {
            background: #fff;
            border-radius: 16px;
            padding: 28px;
            border-left: 6px solid #7F9BC3;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(184, 176, 213, 0.15);
        }

        .task-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(184, 176, 213, 0.25);
            border-left-color: #F5CEE9;
        }

        .task-title {
            font-size: 20px;
            color: #4A4A68;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .task-desc {
            font-size: 15px;
            color: #8888A8;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        /* 超链接按钮 */
        .task-link {
            display: inline-block;
            background: linear-gradient(90deg, #B8B0D5 0%, #F5CEE9 100%);
            color: white;
            text-decoration: none;
            padding: 10px 28px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .task-link:hover {
            background: linear-gradient(90deg, #7F9BC3 0%, #B8B0D5 100%);
            box-shadow: 0 4px 16px rgba(127, 155, 195, 0.35);
            transform: scale(1.03);
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 24px;
            color: #B8B0D5;
            font-size: 13px;
        }

        /* 响应式适配 */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 22px;
            }
            .task-wrapper {
                padding: 24px;
            }
            .task-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页面头部 -->
        <div class="header">
            <h1>任务汇总</h1>
            <p>高效推进 · 有序完成</p >
        </div>

        <!-- 两个任务卡片 -->
        <div class="task-wrapper">
            <!-- 任务 1 -->
            <div class="task-card">
                <div class="task-title">任务一：Flex布局演示</div>
                <div class="task-desc">演示 Flex 布局的典型用法</div>
                <a href="./flex-demo.html" class="task-link">查看详情</a >
            </div>

            <!-- 任务 2 -->
            <div class="task-card">
                <div class="task-title">任务二：响应式布局演示</div>
                <div class="task-desc">演示响应式布局，比如栅格变化、隐藏元素等</div>
                <a href="./responsive-demo.html" class="task-link">查看详情</a >
            </div>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            <p>© 2026 | Flex布局和响应式布局任务演示</p>
        </div>
    </div>
</body>
</html>
